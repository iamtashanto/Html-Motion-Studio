[workspace]
resolver = "2"
members = [
    "crates/hms-core",
    "crates/hms-ffi",
    "crates/hms-desktop-rust",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["HTML Motion Studio Contributors"]

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.5"
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
regex = "1.13"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = "1.18"
slint-build = "1.18"
thiserror = "2.0"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
