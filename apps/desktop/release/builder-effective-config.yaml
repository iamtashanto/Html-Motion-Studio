directories:
  output: release
  buildResources: build
appId: com.htmlmotionstudio.desktop
productName: HTML Motion Studio
copyright: Copyright © 2026 HTML Motion Studio
files:
  - filter:
      - dist/**/*
      - package.json
      - node_modules/sql.js/**/*
mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
linux:
  category: Video
  target:
    - target: AppImage
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
electronVersion: 33.4.11
