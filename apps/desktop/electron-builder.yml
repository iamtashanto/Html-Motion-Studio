appId: com.htmlmotionstudio.desktop
productName: HTML Motion Studio
copyright: Copyright © 2026 TA Shanto
directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - node_modules/sql.js/**/*

mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always

appx:
  applicationId: HTMLMotionStudio
  identityName: HTMLMotionStudio
  publisher: CN=HTMLMotionStudio
  publisherDisplayName: TA Shanto
  displayName: HTML Motion Studio
  backgroundColor: "#070a16"
  showNameOnTiles: true

linux:
  category: Video
  target:
    - target: AppImage
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
