<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="12" />

  <!-- Motion Waves Ambient Glow -->
  <circle cx="512" cy="512" r="320" fill="url(#primaryGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- Central Film & HTML Motion Glyph -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Motion Chevron / Play Shape -->
    <path d="M 120 80 L 400 256 L 120 432 Z" fill="url(#primaryGrad)" />
    
    <!-- Code Bracket Left: < -->
    <path d="M 160 160 L 60 256 L 160 352" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Code Bracket Right: > -->
    <path d="M 352 160 L 452 256 L 352 352" fill="none" stroke="#38bdf8" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Motion Sparkle Orb -->
    <circle cx="400" cy="256" r="28" fill="#ffffff" />
  </g>
</svg>

