<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2238" />
      <stop offset="40%" stop-color="#0f1322" />
      <stop offset="100%" stop-color="#060810" />
    </linearGradient>

    <!-- Top Rim Bevel Highlight -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="15%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </linearGradient>

    <!-- Vibrant Play / Motion Core Gradient -->
    <linearGradient id="motionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Cyan Flare -->
    <linearGradient id="cyanFlare" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Icon Shadow for macOS Depth -->
    <filter id="macShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <rect x="96" y="96" width="832" height="832" rx="196" fill="#38bdf8" opacity="0.12" filter="url(#softGlow)" />

  <!-- Main macOS Squircle Container -->
  <rect x="96" y="96" width="832" height="832" rx="196" fill="url(#bgGrad)" filter="url(#macShadow)" />
  <rect x="96" y="96" width="832" height="832" rx="196" fill="none" stroke="url(#bevelGrad)" stroke-width="6" />

  <!-- Inner Radial Glow -->
  <circle cx="512" cy="512" r="280" fill="url(#motionGrad)" opacity="0.18" filter="url(#softGlow)" />

  <!-- Film Reel / Track Strip Grid Overlay (Subtle) -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="3">
    <line x1="220" y1="240" x2="804" y2="240" />
    <line x1="220" y1="784" x2="804" y2="784" />
    <line x1="220" y1="240" x2="220" y2="784" />
    <line x1="804" y1="240" x2="804" y2="784" />
    <!-- Perforations -->
    <rect x="250" y="254" width="36" height="24" rx="6" fill="#ffffff" />
    <rect x="350" y="254" width="36" height="24" rx="6" fill="#ffffff" />
    <rect x="450" y="254" width="36" height="24" rx="6" fill="#ffffff" />
    <rect x="550" y="254" width="36" height="24" rx="6" fill="#ffffff" />
    <rect x="650" y="254" width="36" height="24" rx="6" fill="#ffffff" />
    <rect x="738" y="254" width="36" height="24" rx="6" fill="#ffffff" />

    <rect x="250" y="746" width="36" height="24" rx="6" fill="#ffffff" />
    <rect x="350" y="746" width="36" height="24" rx="6" fill="#ffffff" />
    <rect x="450" y="746" width="36" height="24" rx="6" fill="#ffffff" />
    <rect x="550" y="746" width="36" height="24" rx="6" fill="#ffffff" />
    <rect x="650" y="746" width="36" height="24" rx="6" fill="#ffffff" />
    <rect x="738" y="746" width="36" height="24" rx="6" fill="#ffffff" />
  </g>

  <!-- Central HTML Motion Glyph: Play triangle + Code tags -->
  <g transform="translate(0, 0)">
    <!-- Play Triangle Core with Gradient Fill -->
    <path d="M 410 330 C 410 315 428 305 442 314 L 690 494 C 702 502 702 522 690 530 L 442 710 C 428 719 410 709 410 694 Z" 
          fill="url(#motionGrad)" 
          filter="url(#softGlow)" />

    <path d="M 410 330 C 410 315 428 305 442 314 L 690 494 C 702 502 702 522 690 530 L 442 710 C 428 719 410 709 410 694 Z" 
          fill="url(#motionGrad)" />

    <!-- Code Bracket: Left < -->
    <path d="M 370 360 L 260 512 L 370 664" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Code Slash: / -->
    <path d="M 470 380 L 410 644" 
          fill="none" 
          stroke="#38bdf8" 
          stroke-width="36" 
          stroke-linecap="round" 
          opacity="0.9" />

    <!-- Code Bracket: Right > -->
    <path d="M 654 360 L 764 512 L 654 664" 
          fill="none" 
          stroke="url(#cyanFlare)" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Motion Sparkle Orb -->
    <circle cx="560" cy="512" r="32" fill="#ffffff" />
    <circle cx="560" cy="512" r="20" fill="#38bdf8" />
  </g>
</svg>
